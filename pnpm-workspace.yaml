# Dependências autorizadas a executar scripts de instalação (postinstall).
# Sem isso o pnpm 10+ falha com ERR_PNPM_IGNORED_BUILDS.
#
# pnpm 10 lê "onlyBuiltDependencies"; pnpm 11+ lê "allowBuilds".
# Mantemos as duas chaves para funcionar em ambas as versões.
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild

allowBuilds:
  "@swc/core": true
  esbuild: true
